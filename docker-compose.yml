services:
  directadmin-mcp:
    build: .
    image: directadmin-mcp:2.3.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_HOST: "0.0.0.0"
    ports:
      # Publish only on loopback by default — put Caddy/nginx in front for TLS.
      - "127.0.0.1:8888:8888"
    volumes:
      - mcp-logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 128

volumes:
  mcp-logs:
