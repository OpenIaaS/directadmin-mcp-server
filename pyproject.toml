[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "directadmin-mcp"
version = "2.1.0"
description = "Model Context Protocol server for DirectAdmin admin operations (SSL reissue, CSF unblock, full New API)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenIaaS" }]
keywords = ["directadmin", "mcp", "ssl", "letsencrypt", "csf", "firewall"]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "starlette>=0.36.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "mcp>=1.6.0,<2.0.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.4.0"]

[project.scripts]
directadmin-mcp = "server:main"

[tool.setuptools]
py-modules = ["config", "da", "security", "mcp_instance", "main", "server"]

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]
